{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Import Students</h2>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            class="btn btn-primary"
            type="submit">

            Import Students

        </button>

    </form>

</div>

{% endblock %}
