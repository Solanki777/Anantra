name: Keep Render App Awake

on:
  schedule:
    # Runs every 5 minutes (GitHub may throttle to ~10-15 min on busy periods, still enough to beat Render's 15-min sleep timer)
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render app
        run: |
          echo "Pinging https://anantra.onrender.com/ ..."
          curl -sS -o /dev/null -w "HTTP Status: %{http_code}\n" https://anantra.onrender.com/